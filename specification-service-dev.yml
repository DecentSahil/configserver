spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/requirement_db
    username: "{cipher}9cbeeec460563185278ff57238498f66c1b92303c96d0e829a645fed0f54d4ce"
    password: "{cipher}7f87dc9deba3672be3347eb9f941ee4854315132312bdb2994c38d9e1a2428af"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          AI-SERVICE:
            connectTimeout: 3000
            readTimeout: 400000

resilience4j:
  timelimiter:
    instances:
      AIServiceClientgenerateRequirementsGenerateRequirementRequest:
        timeoutDuration: 60s
        cancelRunningFuture: true

  retry:
    instances:
      ai-service:
        maxAttempts: 3
        waitDuration: 2s

  circuitbreaker:
    instances:
      ai-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 20s

logging:
  level:
    root: INFO
    com.requirement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  specification:
    key-prefix: SPEC
